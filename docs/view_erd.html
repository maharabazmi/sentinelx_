<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SentinelX — Interactive ERD & Architecture Diagrams</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --border: #1f293d;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.2);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1.25rem 2rem;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .logo-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .badge {
      background: var(--accent-glow);
      color: var(--accent);
      border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .nav-tabs {
      display: flex;
      gap: 0.5rem;
    }
    .tab-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.5rem 1.1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.15s ease;
    }
    .tab-btn.active, .tab-btn:hover {
      background: var(--accent);
      color: #04100c;
      border-color: var(--accent);
    }
    .actions {
      display: flex;
      gap: 0.6rem;
    }
    .action-btn {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      padding: 0.45rem 0.9rem;
      border-radius: 0.5rem;
      font-size: 0.82rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }
    .action-btn:hover {
      background: #334155;
      border-color: #475569;
    }
    main {
      flex: 1;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: auto;
    }
    .diagram-container {
      width: 100%;
      max-width: 1400px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
    }
    .diagram-container img {
      max-width: 100%;
      height: auto;
      border-radius: 0.375rem;
      background: #ffffff;
      padding: 1.5rem;
    }
    footer {
      padding: 1rem 2rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-group">
      <span class="badge">Docs Artifact</span>
      <h1>SentinelX Architecture & ERD Viewer</h1>
    </div>

    <div class="nav-tabs">
      <button id="btnErd" class="tab-btn active" onclick="switchTab('erd')">Entity-Relationship Diagram (ERD)</button>
      <button id="btnArch" class="tab-btn" onclick="switchTab('arch')">System Architecture</button>
    </div>

    <div class="actions">
      <a id="downloadSvg" href="./sentinelx_erd.svg" download="sentinelx_erd.svg" class="action-btn">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        Download SVG
      </a>
      <a id="downloadPng" href="./sentinelx_erd.png" download="sentinelx_erd.png" class="action-btn">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        Download PNG
      </a>
    </div>
  </header>

  <main>
    <div class="diagram-container">
      <img id="diagramImage" src="./sentinelx_erd.svg" alt="SentinelX Diagram" />
    </div>
  </main>

  <footer>
    SentinelX &bull; National Civil Safety & Consumer Integrity Platform &bull; People's Republic of Bangladesh
  </footer>

  <script>
    function switchTab(tab) {
      const img = document.getElementById('diagramImage');
      const btnErd = document.getElementById('btnErd');
      const btnArch = document.getElementById('btnArch');
      const dlSvg = document.getElementById('downloadSvg');
      const dlPng = document.getElementById('downloadPng');

      if (tab === 'erd') {
        btnErd.classList.add('active');
        btnArch.classList.remove('active');
        img.src = './sentinelx_erd.svg';
        dlSvg.href = './sentinelx_erd.svg';
        dlSvg.download = 'sentinelx_erd.svg';
        dlPng.href = './sentinelx_erd.png';
        dlPng.download = 'sentinelx_erd.png';
      } else {
        btnArch.classList.add('active');
        btnErd.classList.remove('active');
        img.src = './sentinelx_architecture.svg';
        dlSvg.href = './sentinelx_architecture.svg';
        dlSvg.download = 'sentinelx_architecture.svg';
        dlPng.href = './sentinelx_architecture.png';
        dlPng.download = 'sentinelx_architecture.png';
      }
    }
  </script>
</body>
</html>
